[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "backpack-backcrack"
version = "0.3.1"
description = "CD/DVD/Blu-ray rip pipeline - MakeMKV/HandBrake for video, cdparanoia for audio, dynamic %token% library patterning."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
dependencies = ["backpack-backbone>=0.4.0,<0.5"]
classifiers = [
    "Environment :: Console :: Curses",
    "Topic :: Multimedia :: Sound/Audio :: CD Audio :: CD Ripping",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
Homepage = "https://github.com/RedEraRrow/backcrack"
Issues = "https://github.com/RedEraRrow/backcrack/issues"

# One command: every tool is a subcommand (`backcrack watch`, `backcrack status`),
# so plain words like watch and status aren't taken on the PATH.
[project.scripts]
backcrack = "backcrack.cli:main"

[tool.setuptools.packages.find]
include = ["backcrack*"]
