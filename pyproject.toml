[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "backcrack"
version = "0.1.0"
description = "CD/DVD/Blu-ray rip pipeline - MakeMKV/HandBrake for video, cdparanoia for audio, dynamic %token% library patterning."
requires-python = ">=3.9"
license = { text = "MIT" }
# Not on PyPI - installed from its sibling checkout, at this absolute path
# (see README, Install). If backbone is already installed, pip sees the
# requirement satisfied and leaves it.
dependencies = ["backbone @ file:///Users/local/backpack/backbone"]

[project.scripts]
backcrack = "cli:main"
ripd = "ripd:main"
encd = "encd:main"
sortd = "sortd:main"
watch = "watch:main"
status = "status:main"
swapd = "swapd:main"
titles = "titles:main"
diskspeed = "diskspeed:main"
namer = "namer:main"

[tool.setuptools]
packages = ["backcrack"]
py-modules = ["cli", "ripd", "encd", "sortd", "watch", "status", "swapd", "titles", "diskspeed", "namer"]
