[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "backcrack"
version = "0.1.0"
description = "CD/DVD/Blu-ray rip pipeline - MakeMKV/HandBrake for video, cdparanoia for audio, dynamic %token% library patterning."
requires-python = ">=3.10"
license = { text = "MIT" }
# Not on PyPI. If backbone is already installed (editable, from a checkout),
# pip sees the requirement satisfied and leaves it.
dependencies = ["backbone @ git+https://github.com/RedEraRrow/backbone.git"]

[project.scripts]
backcrack = "cli:main"
ripd = "ripd:main"
encd = "encd:main"
sortd = "sortd:main"
watch = "watch:main"
status = "status:main"
swapd = "swapd:main"
titles = "titles:main"
diskspeed = "diskspeed:main"
namer = "namer:main"

[tool.setuptools]
packages = ["backcrack"]
py-modules = ["cli", "ripd", "encd", "sortd", "watch", "status", "swapd", "titles", "diskspeed", "namer"]
