[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "backcrack"
version = "0.1.0"
description = "CD/DVD/Blu-ray rip pipeline - MakeMKV/HandBrake for video, cdparanoia for audio, dynamic %token% library patterning."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
# Not on PyPI. If backbone is already installed (editable, from a checkout),
# pip sees the requirement satisfied and leaves it.
dependencies = ["backbone @ git+https://github.com/RedEraRrow/backbone.git"]

[project.scripts]
backcrack = "backcrack.cli:main"
ripd = "backcrack.ripd:main"
encd = "backcrack.encd:main"
sortd = "backcrack.sortd:main"
watch = "backcrack.watch:main"
status = "backcrack.status:main"
swapd = "backcrack.swapd:main"
titles = "backcrack.titles:main"
diskspeed = "backcrack.diskspeed:main"
namer = "backcrack.namer:main"

[tool.setuptools.packages.find]
include = ["backcrack*"]
